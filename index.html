<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chromebook Portal</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body { font-family: Arial; margin:0; }
.hidden { display:none; }
.tab { display:none; padding:20px; }
.tab.active { display:block; }
.sidebar { width:220px; float:left; background:#111; color:#fff; height:100vh; padding:10px; }
.main { margin-left:220px; padding:10px; }
button { margin:5px; }
.stat { display:inline-block; padding:10px; margin:5px; background:#eee; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <h2>Login</h2>
  <input id="user" placeholder="School"/>
  <input id="pass" type="password" placeholder="Key"/>
  <button onclick="login()">Login</button>
  <div id="msg"></div>
</div>

<!-- APP -->
<div id="app" class="hidden">

<div class="sidebar">
  <button onclick="showTab('dash')">Dashboard</button>
  <button onclick="showTab('report')">Report</button>
  <button onclick="showTab('check')">Check In/Out</button>
</div>

<div class="main">

<!-- DASH -->
<div id="dash" class="tab active">
  <h2>Dashboard</h2>

  <div class="stat">Total: <span id="t">-</span></div>
  <div class="stat">In: <span id="i">-</span></div>
  <div class="stat">Out: <span id="o">-</span></div>
  <div class="stat">Overdue: <span id="d">-</span></div>

  <h3>Recent</h3>
  <div id="recent"></div>
</div>

<!-- REPORT -->
<div id="report" class="tab">
  <h2>Report</h2>
  <button onclick="loadReport()">Refresh</button>
  <div id="reportBox">Loading...</div>
</div>

<!-- CHECK -->
<div id="check" class="tab">
  <h2>Checkout / Checkin</h2>

  <input id="cb" placeholder="Chromebook #"/>
  <input id="st" placeholder="Student ID"/>
  <button onclick="checkout()">Checkout</button>

  <br><br>

  <input id="cb2" placeholder="Chromebook #"/>
  <button onclick="checkin()">Checkin</button>

  <div id="m"></div>
</div>

</div>
</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbzSeHeIL1CyunKi6fQUU0cOGePiOxLy1KXwaw6N_L1nBgFr6MRgAUIXrIO2D2TmoGk/exec";

let cache = {
  summary: null,
  report: null,
  ts: 0
};

const TTL = 15000;

// ---------------- LOGIN ----------------
function login() {
  const u = user.value, p = pass.value;
  if (p !== "chromebook") return msg.innerText = "Wrong key";

  localStorage.setItem("user", u);
  login.style.display = "none";
  app.classList.remove("hidden");

  loadDashboard();
}

// ---------------- TAB ----------------
function showTab(t) {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  document.getElementById(t).classList.add("active");

  if (t === "dash") loadDashboard();
  if (t === "report") loadReport();
}

// ---------------- CACHE FETCH ----------------
async function getSummary() {
  if (cache.summary && Date.now() - cache.ts < TTL) return cache.summary;

  const r = await fetch(URL + "?action=summary");
  cache.summary = await r.json();
  cache.ts = Date.now();
  return cache.summary;
}

async function getReport(force=false) {
  if (!force && cache.report && Date.now() - cache.ts < TTL) return cache.report;

  const r = await fetch(URL + "?action=report");
  cache.report = await r.json();
  cache.ts = Date.now();
  return cache.report;
}

// ---------------- DASHBOARD ----------------
async function loadDashboard() {
  const d = await getSummary();

  t.innerText = d.total;
  i.innerText = d.in;
  o.innerText = d.out;
  this.d.innerText = d.overdue;

  recent.innerHTML = d.recent.map(x =>
    `<div>${x.text}</div>`
  ).join("");
}

// ---------------- REPORT ----------------
async function loadReport() {
  const d = await getReport();

  reportBox.innerHTML =
    "<table border=1><tr><th>CB</th><th>Student</th><th>Status</th></tr>" +
    d.rows.map(r =>
      `<tr><td>${r.cbNum}</td><td>${r.studentId}</td><td>${r.status}</td></tr>`
    ).join("") +
    "</table>";
}

// ---------------- CHECKOUT ----------------
async function checkout() {
  m.innerText = "Saving...";

  await fetch(URL, {
    method:"POST",
    body: JSON.stringify({
      action:"checkout",
      cbNum: cb.value,
      studentId: st.value
    })
  });

  cache.summary = null;
  cache.report = null;

  m.innerText = "Done";
  loadDashboard();
}

// ---------------- CHECKIN ----------------
async function checkin() {
  m.innerText = "Saving...";

  await fetch(URL, {
    method:"POST",
    body: JSON.stringify({
      action:"checkin",
      cbNum: cb2.value
    })
  });

  cache.summary = null;
  cache.report = null;

  m.innerText = "Done";
  loadDashboard();
}
</script>

</body>
</html>
