<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poolesville Chromebook System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="card login-card">
  <h1>📦 Poolesville Chromebook System</h1>
  <p class="subtitle">Create an account or sign in</p>
  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">
  <div class="login-buttons">
    <button class="btn" onclick="login()">Sign In</button>
    <button class="btn" onclick="createAccount()">Create Account</button>
  </div>
  <div id="loginMsg" class="msg"></div>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">
  <div class="card">
    <div class="topbar">
      <h1>📦 Poolesville Chromebook System</h1>
      <button class="btn" onclick="logout()">Logout</button>
    </div>

    <div class="nav">
      <button class="btn active" onclick="showTab('checkout', this)">Check Out</button>
      <button class="btn" onclick="showTab('checkin', this)">Check In</button>
      <button class="btn" onclick="showTab('report', this)">Report</button>
    </div>

    <!-- CHECKOUT TAB -->
    <div id="checkout" class="tab active">
      <h2>Check Out Chromebook</h2>
      <input id="coNum" placeholder="Chromebook Number (1–32)">
      <input id="coStudent" placeholder="Student ID">
      <input id="coCheckedOutBy" placeholder="Checked out by (F / S / M)">
      <input id="coNotes" placeholder="Notes (optional)">
      <button class="btn" onclick="checkout()">Check Out</button>
      <div id="coMsg" class="msg"></div>
    </div>

    <!-- CHECKIN TAB -->
    <div id="checkin" class="tab">
      <h2>Check In Chromebook</h2>
      <input id="ciNum" placeholder="Chromebook Number (1–32)">
      <input id="ciCheckedInBy" placeholder="Checked in by (F / S / M)">
      <button class="btn" onclick="checkin()">Check In</button>
      <div id="ciMsg" class="msg"></div>
    </div>

    <!-- REPORT TAB -->
    <div id="report" class="tab">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h2>Report</h2>
        <button class="btn" onclick="printReport()">🖨️ Print Report</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>CB #</th>
            <th>Barcode</th>
            <th>Serial #</th>
            <th>Student ID</th>
            <th>Checked Out</th>
            <th>Checked In</th>
            <th>Checked Out By</th>
            <th>Checked In By</th>
            <th>Notes</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="reportBody"></tbody>
      </table>
    </div>

  </div>
</div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx_mNAjFpkxu80KewXVIAxzvq7iuYcfGdkZSmKaigsLbqOVi8B_VZJpeM4I2frrf-htPg/exec';

function getUsers()   { return JSON.parse(localStorage.getItem('cbUsers') || '{}'); }
function saveUsers(u) { localStorage.setItem('cbUsers', JSON.stringify(u)); }

window.addEventListener('DOMContentLoaded', () => {
  if (localStorage.getItem('cbLoggedIn')) {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    loadReport();
  }
});

function login() {
  const user  = document.getElementById('username').value.trim();
  const pass  = document.getElementById('password').value.trim();
  const msg   = document.getElementById('loginMsg');
  const users = getUsers();
  if (!user || !pass)       { showMsg(msg, 'Enter username and password.', 'error'); return; }
  if (!users[user])         { showMsg(msg, 'Account not found.', 'error'); return; }
  if (users[user] !== pass) { showMsg(msg, 'Wrong password.', 'error'); return; }
  localStorage.setItem('cbLoggedIn', user);
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  loadReport();
}

function createAccount() {
  const user  = document.getElementById('username').value.trim();
  const pass  = document.getElementById('password').value.trim();
  const msg   = document.getElementById('loginMsg');
  const users = getUsers();
  if (!user || !pass) { showMsg(msg, 'Enter a username and password.', 'error'); return; }
  if (users[user])    { showMsg(msg, 'Username already taken.', 'error'); return; }
  users[user] = pass;
  saveUsers(users);
  showMsg(msg, 'Account created! You can now sign in.', 'success');
}

function logout() {
  localStorage.removeItem('cbLoggedIn');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
}

function showTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.nav .btn').forEach(b => b.classList.remove('active'));
  document.getElementById(name).classList.add('active');
  btn.classList.add('active');
  if (name === 'report') loadReport();
}

async function checkout() {
  const cbNum        = document.getElementById('coNum').value.trim();
  const stuId        = document.getElementById('coStudent').value.trim();
  const checkedOutBy = document.getElementById('coCheckedOutBy').value.trim();
  const notes        = document.getElementById('coNotes').value.trim();
  const msg          = document.getElementById('coMsg');
  if (!cbNum || !stuId) { showMsg(msg, 'Enter Chromebook # and Student ID.', 'error'); return; }
  showMsg(msg, 'Saving...', '');
  try {
    const res  = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'checkout', cbNum, studentId: stuId, checkoutDate: today(), checkedOutBy, notes })
    });
    const data = await res.json();
    if (data.success) {
      showMsg(msg, `✓ Chromebook #${cbNum} checked out to ${stuId}.`, 'success');
      document.getElementById('coNum').value = '';
      document.getElementById('coStudent').value = '';
      document.getElementById('coCheckedOutBy').value = '';
      document.getElementById('coNotes').value = '';
    } else {
      showMsg(msg, data.message || 'Error.', 'error');
    }
  } catch(e) {
    showMsg(msg, 'Connection error. Check your Script URL.', 'error');
  }
}

async function checkin() {
  const cbNum       = document.getElementById('ciNum').value.trim();
  const checkedInBy = document.getElementById('ciCheckedInBy').value.trim();
  const msg         = document.getElementById('ciMsg');
  if (!cbNum) { showMsg(msg, 'Enter Chromebook #.', 'error'); return; }
  showMsg(msg, 'Saving...', '');
  try {
    const res  = await fetch(SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'checkin', cbNum, checkinDate: today(), checkedInBy })
    });
    const data = await res.json();
    if (data.success) {
      showMsg(msg, `✓ Chromebook #${cbNum} checked back in (was with student ${data.studentId}).`, 'success');
      document.getElementById('ciNum').value = '';
      document.getElementById('ciCheckedInBy').value = '';
    } else {
      showMsg(msg, data.message || 'Error.', 'error');
    }
  } catch(e) {
    showMsg(msg, 'Connection error. Check your Script URL.', 'error');
  }
}

async function loadReport() {
  const tbody = document.getElementById('reportBody');
  if (!tbody) return;
  tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:#6b7494;padding:20px">Loading...</td></tr>';
  try {
    const res  = await fetch(SCRIPT_URL + '?action=report');
    const data = await res.json();
    const rows = data.rows || [];
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:#6b7494;padding:20px">No records yet.</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(r => `
      <tr>
        <td>#${r.cbNum}</td>
        <td>${r.barcode || '—'}</td>
        <td>${r.serial  || '—'}</td>
        <td>${r.studentId}</td>
        <td>${r.checkoutDate}</td>
        <td>${r.checkinDate}</td>
        <td>${r.checkedOutBy}</td>
        <td>${r.checkedInBy}</td>
        <td>${r.notes}</td>
        <td><span class="badge ${r.status === 'Out' ? 'badge-out' : 'badge-in'}">${r.status}</span></td>
      </tr>
    `).join('');
  } catch(e) {
    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:#ff4f4f;padding:20px">Could not load data. Check your Script URL.</td></tr>';
  }
}

function today() {
  return new Date().toLocaleDateString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit' });
}

function showMsg(el, text, type) {
  el.textContent = text;
  el.className = 'msg ' + type;
}

function printReport() {
  const reportContent = document.getElementById('report').innerHTML;
  const printWindow = window.open('', '_blank');
  printWindow.document.write(`
    <html>
      <head>
        <title>Chromebook Report</title>
        <style>
          body { font-family: Arial, sans-serif; padding: 20px; }
          table { width: 100%; border-collapse: collapse; }
          th, td { border: 1px solid #000; padding: 8px; text-align: left; }
          th { background: #f2f2f2; }
          button { display: none; }
        </style>
      </head>
      <body>
        <h1>Poolesville Chromebook Report</h1>
        ${reportContent}
      </body>
    </html>
  `);
  printWindow.document.close();
  printWindow.focus();
  setTimeout(() => { printWindow.print(); }, 500);
}
</script>
</body>
</html>
